name: Local correctness and security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r requirements-dev.lock
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --audit-level=moderate
      - run: npm run build --prefix frontend
      - run: npm run test:charts --prefix frontend
      - run: .venv/bin/python -m pytest -q --junitxml=artifacts/verification/pytest.xml
      - run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix frontend
      - run: python scripts/evaluate_release.py artifacts/verification/browser-export.zip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/verification
