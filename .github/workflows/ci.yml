name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
# No publication, cloud deployment or paid inference. Full application checks
# and a pinned independent Gitleaks CI installation are implementation tasks.
