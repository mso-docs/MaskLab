[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masklab"
version = "0.1.0.dev0"
description = "A reproducible behavioral research workbench for persona and framing studies"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
